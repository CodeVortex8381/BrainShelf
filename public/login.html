<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — BrainShelf</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <header class="navbar">
        <a class="logo" href="/">Brain<span>Shelf</span></a>
        <nav>
            <a href="/">Home</a>
            <a href="/#notes">Explore Notes</a>
            <a href="/#about">About</a>
        </nav>
        <div class="nav-actions" id="navbarAuthSlot">
            <a href="/register.html" class="nav-button">Get Started</a>
        </div>
    </header>

    <main class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <span class="tag">WELCOME BACK</span>
                <h1>Sign in to BrainShelf</h1>
                <p>Access your notes, submissions, and community library.</p>
            </div>

            <div id="loginAlert" class="form-alert" role="alert"></div>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="loginEmail">Email Address</label>
                    <input
                        type="email"
                        id="loginEmail"
                        name="email"
                        placeholder="you@college.edu"
                        required
                        autocomplete="email"
                    >
                </div>

                
                <div class="form-group">
                    <label for="loginPassword">Password</label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="loginPassword"
                            name="password"
                            placeholder="••••••••"
                            required
                            autocomplete="current-password"
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="toggle-password"
                            aria-label="Show password"
                            aria-pressed="false"
                            title="Show password"
                        >
                            <svg class="eye-icon eye-show" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg class="eye-icon eye-hide" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: none;">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                </div>


                <button type="submit" id="loginSubmitBtn" class="btn-submit">
                    Sign In
                </button>
            </form>

            <div class="auth-footer">
                Don't have an account yet? <a href="/register.html">Create an account</a>
            </div>
        </div>
    </main>

    <footer>
        <a class="logo" href="/">Brain<span>Shelf</span></a>
        <p>Learn together. Grow together.</p>
        <small>© 2026 BrainShelf · Student Notes Sharing Platform</small>
    </footer>

    <script src="/js/auth.js"></script>
    <script>
        const loginForm = document.getElementById("loginForm");
        const loginAlert = document.getElementById("loginAlert");
        const loginSubmitBtn = document.getElementById("loginSubmitBtn");

        loginForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            loginAlert.className = "form-alert";
            loginAlert.style.display = "none";

            const email = document.getElementById("loginEmail").value.trim();
            const password = document.getElementById("loginPassword").value;

            if (!email || !password) {
                showAlert("Please enter both your email address and password.", "error");
                return;
            }

            loginSubmitBtn.disabled = true;
            loginSubmitBtn.textContent = "Signing in...";

            try {
                const res = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.error || "Invalid credentials.");
                }

                showAlert("Sign in successful! Redirecting...", "success");

                setTimeout(() => {
                    if (data.user && data.user.role === "admin") {
                        window.location.href = "/admin.html";
                    } else {
                        window.location.href = "/";
                    }
                }, 800);
            } catch (err) {
                showAlert(err.message, "error");
                loginSubmitBtn.disabled = false;
                loginSubmitBtn.textContent = "Sign In";
            }
        });

        function showAlert(msg, type) {
            loginAlert.textContent = msg;
            loginAlert.className = `form-alert ${type}`;
            loginAlert.style.display = "block";
        }

        const togglePassword = document.getElementById("togglePassword");
        const passwordInput = document.getElementById("loginPassword");

        if (togglePassword && passwordInput) {
            const eyeShow = togglePassword.querySelector(".eye-show");
            const eyeHide = togglePassword.querySelector(".eye-hide");

            togglePassword.addEventListener("click", (e) => {
                e.preventDefault();
                const isHidden = passwordInput.type === "password";
                passwordInput.type = isHidden ? "text" : "password";

                if (eyeShow && eyeHide) {
                    eyeShow.style.display = isHidden ? "none" : "block";
                    eyeHide.style.display = isHidden ? "block" : "none";
                }

                const label = isHidden ? "Hide password" : "Show password";
                togglePassword.setAttribute("aria-label", label);
                togglePassword.setAttribute("title", label);
                togglePassword.setAttribute("aria-pressed", String(isHidden));

                passwordInput.focus();
                const len = passwordInput.value.length;
                if (passwordInput.setSelectionRange) {
                    passwordInput.setSelectionRange(len, len);
                }
            });
        }
    </script>
</body>
</html>
