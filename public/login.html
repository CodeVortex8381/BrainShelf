<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — BrainShelf</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <header class="navbar">
        <a class="logo" href="/">Brain<span>Shelf</span></a>
        <nav>
            <a href="/">Home</a>
            <a href="/#notes">Explore Notes</a>
            <a href="/#about">About</a>
        </nav>
        <div class="nav-actions" id="navbarAuthSlot">
            <a href="/register.html" class="nav-button">Get Started</a>
        </div>
    </header>

    <main class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <span class="tag">WELCOME BACK</span>
                <h1>Sign in to BrainShelf</h1>
                <p>Access your notes, submissions, and community library.</p>
            </div>

            <!-- Interactive Animated Login Mascot -->
            <div class="mascot-wrapper" aria-hidden="true">
                <div class="mascot" id="loginMascot">
                    <div class="mascot-ear mascot-ear-left"></div>
                    <div class="mascot-ear mascot-ear-right"></div>
                    <div class="mascot-face">
                        <div class="mascot-blush mascot-blush-left"></div>
                        <div class="mascot-blush mascot-blush-right"></div>
                        <div class="mascot-eyes">
                            <div class="mascot-eye mascot-eye-left" id="mascotEyeLeft">
                                <div class="mascot-pupil" id="mascotPupilLeft">
                                    <span class="pupil-sparkle"></span>
                                </div>
                                <div class="mascot-eyelid"></div>
                                <div class="mascot-closed-curve"></div>
                            </div>
                            <div class="mascot-eye mascot-eye-right" id="mascotEyeRight">
                                <div class="mascot-pupil" id="mascotPupilRight">
                                    <span class="pupil-sparkle"></span>
                                </div>
                                <div class="mascot-eyelid"></div>
                                <div class="mascot-closed-curve"></div>
                            </div>
                        </div>
                        <div class="mascot-snout">
                            <div class="mascot-nose"></div>
                            <div class="mascot-mouth"></div>
                        </div>
                        <div class="mascot-paws">
                            <div class="mascot-paw mascot-paw-left"></div>
                            <div class="mascot-paw mascot-paw-right"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="loginAlert" class="form-alert" role="alert"></div>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="loginEmail">Email Address</label>
                    <input
                        type="email"
                        id="loginEmail"
                        name="email"
                        placeholder="you@college.edu"
                        required
                        autocomplete="email"
                    >
                </div>

                
                <div class="form-group">
                    <label for="loginPassword">Password</label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="loginPassword"
                            name="password"
                            placeholder="••••••••"
                            required
                            autocomplete="current-password"
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="toggle-password"
                            aria-label="Show password"
                            aria-pressed="false"
                            title="Show password"
                        >
                            <svg class="eye-icon eye-show" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg class="eye-icon eye-hide" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: none;">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                </div>


                <button type="submit" id="loginSubmitBtn" class="btn-submit">
                    Sign In
                </button>
            </form>

            <div class="auth-footer">
                Don't have an account yet? <a href="/register.html">Create an account</a>
            </div>
        </div>
    </main>

    <footer>
        <a class="logo" href="/">Brain<span>Shelf</span></a>
        <p>Learn together. Grow together.</p>
        <small>© 2026 BrainShelf · Student Notes Sharing Platform</small>
    </footer>

    <script src="/js/auth.js"></script>
    <script>
        const loginForm = document.getElementById("loginForm");
        const loginAlert = document.getElementById("loginAlert");
        const loginSubmitBtn = document.getElementById("loginSubmitBtn");

        loginForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            loginAlert.className = "form-alert";
            loginAlert.style.display = "none";

            const email = document.getElementById("loginEmail").value.trim();
            const password = document.getElementById("loginPassword").value;

            if (!email || !password) {
                showAlert("Please enter both your email address and password.", "error");
                return;
            }

            loginSubmitBtn.disabled = true;
            loginSubmitBtn.textContent = "Signing in...";

            try {
                const res = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.error || "Invalid credentials.");
                }

                showAlert("Sign in successful! Redirecting...", "success");

                setTimeout(() => {
                    if (data.user && data.user.role === "admin") {
                        window.location.href = "/admin.html";
                    } else {
                        window.location.href = "/";
                    }
                }, 800);
            } catch (err) {
                showAlert(err.message, "error");
                loginSubmitBtn.disabled = false;
                loginSubmitBtn.textContent = "Sign In";
            }
        });

        const togglePassword = document.getElementById("togglePassword");
        const passwordInput = document.getElementById("loginPassword");
        const mascot = document.getElementById("loginMascot");
        const eyeLeft = document.getElementById("mascotEyeLeft");
        const eyeRight = document.getElementById("mascotEyeRight");
        const pupilLeft = document.getElementById("mascotPupilLeft");
        const pupilRight = document.getElementById("mascotPupilRight");

        let isPasswordFocused = false;
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let rafPending = false;

        // Mascot error shake animation
        function triggerMascotErrorAnimation() {
            if (!mascot) return;
            mascot.classList.remove("error-shake");
            void mascot.offsetWidth; // Trigger browser reflow to restart animation
            mascot.classList.add("error-shake");

            setTimeout(() => {
                mascot.classList.remove("error-shake");
                updateMascotExpression();
            }, 750);
        }

        function showAlert(msg, type) {
            loginAlert.textContent = msg;
            loginAlert.className = `form-alert ${type}`;
            loginAlert.style.display = "block";

            if (type === "error") {
                triggerMascotErrorAnimation();
            }
        }

        // Mascot expression manager
        function updateMascotExpression() {
            if (!mascot) return;
            const isPassVisible = passwordInput && passwordInput.type === "text";
            const isPassActive = isPasswordFocused || (document.activeElement === passwordInput);
            const shouldClose = isPassVisible || isPassActive;

            if (shouldClose) {
                mascot.classList.add("eyes-closed");
                if (pupilLeft) pupilLeft.style.transform = "translate3d(0, 0, 0)";
                if (pupilRight) pupilRight.style.transform = "translate3d(0, 0, 0)";
            } else {
                mascot.classList.remove("eyes-closed");
                updatePupils();
            }
        }

        // Smooth pupil tracking with bounded travel radius
        function movePupil(eye, pupil, targetX, targetY) {
            if (!eye || !pupil) return;
            const rect = eye.getBoundingClientRect();
            const eyeCenterX = rect.left + rect.width / 2;
            const eyeCenterY = rect.top + rect.height / 2;

            const dx = targetX - eyeCenterX;
            const dy = targetY - eyeCenterY;
            const angle = Math.atan2(dy, dx);
            const dist = Math.hypot(dx, dy);

            // Pupil radius bounding: max travel is 5px so pupil stays well inside the 24px eye
            const maxRadius = 5.2;
            const radius = Math.min(maxRadius, dist / 22);

            const pupilX = Math.cos(angle) * radius;
            const pupilY = Math.sin(angle) * radius;

            pupil.style.transform = `translate3d(${pupilX.toFixed(2)}px, ${pupilY.toFixed(2)}px, 0)`;
        }

        function updatePupils() {
            rafPending = false;
            if (!mascot || mascot.classList.contains("eyes-closed")) return;
            movePupil(eyeLeft, pupilLeft, mouseX, mouseY);
            movePupil(eyeRight, pupilRight, mouseX, mouseY);
        }

        function onPointerMove(e) {
            mouseX = e.clientX;
            mouseY = e.clientY;
            if (!rafPending && mascot && !mascot.classList.contains("eyes-closed")) {
                rafPending = true;
                requestAnimationFrame(updatePupils);
            }
        }

        function onTouchMove(e) {
            if (e.touches && e.touches[0]) {
                mouseX = e.touches[0].clientX;
                mouseY = e.touches[0].clientY;
                if (!rafPending && mascot && !mascot.classList.contains("eyes-closed")) {
                    rafPending = true;
                    requestAnimationFrame(updatePupils);
                }
            }
        }

        window.addEventListener("pointermove", onPointerMove, { passive: true });
        window.addEventListener("touchmove", onTouchMove, { passive: true });

        // Password focus and blur listeners
        if (passwordInput) {
            passwordInput.addEventListener("focus", () => {
                isPasswordFocused = true;
                updateMascotExpression();
            });

            passwordInput.addEventListener("blur", () => {
                isPasswordFocused = false;
                updateMascotExpression();
            });
        }

        // Hide password function
        function hidePassword() {
            if (!passwordInput || passwordInput.type !== "text") return;
            passwordInput.type = "password";
            if (togglePassword) {
                const eyeShow = togglePassword.querySelector(".eye-show");
                const eyeHide = togglePassword.querySelector(".eye-hide");
                if (eyeShow && eyeHide) {
                    eyeShow.style.display = "block";
                    eyeHide.style.display = "none";
                }
                togglePassword.setAttribute("aria-label", "Show password");
                togglePassword.setAttribute("title", "Show password");
                togglePassword.setAttribute("aria-pressed", "false");
            }
            updateMascotExpression();
        }

        const emailInput = document.getElementById("loginEmail");
        if (emailInput) {
            emailInput.addEventListener("focus", hidePassword);
            emailInput.addEventListener("click", hidePassword);
        }

        // Toggle password show/hide button
        if (togglePassword && passwordInput) {
            const eyeShow = togglePassword.querySelector(".eye-show");
            const eyeHide = togglePassword.querySelector(".eye-hide");

            togglePassword.addEventListener("click", (e) => {
                e.preventDefault();
                const isHidden = passwordInput.type === "password";
                passwordInput.type = isHidden ? "text" : "password";

                if (eyeShow && eyeHide) {
                    eyeShow.style.display = isHidden ? "none" : "block";
                    eyeHide.style.display = isHidden ? "block" : "none";
                }

                const label = isHidden ? "Hide password" : "Show password";
                togglePassword.setAttribute("aria-label", label);
                togglePassword.setAttribute("title", label);
                togglePassword.setAttribute("aria-pressed", String(isHidden));

                // Maintain appropriate mascot expression
                updateMascotExpression();
            });
        }

        // Initialize pupil tracking
        updatePupils();
    </script>
</body>
</html>
